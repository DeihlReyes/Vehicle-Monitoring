<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Riding Behavior Monitor</title>
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/charts.css" />
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
  </head>
  <body>
    <div class="app-container">
      <!-- Dashboard Tab -->
      <div class="tab-content" id="dashboard-tab">
        <div class="dashboard-grid">
          <div class="behavior-summary">
            <h2>Behavior Summary</h2>
            <div class="behavior-stats">
              <div class="stat-card">
                <span class="stat-label">Aggressive Events</span>
                <span class="stat-value" id="aggressive-count">0</span>
              </div>
              <div class="stat-card">
                <span class="stat-label">Normal Events</span>
                <span class="stat-value" id="normal-count">0</span>
              </div>
            </div>
          </div>
          <div class="behavior-chart">
            <div id="behavior-distribution"></div>
          </div>
          <div class="recent-events">
            <h2>Recent Events</h2>
            <div id="events-list"></div>
          </div>
        </div>
      </div>

      <!-- Behavior Tab -->
      <div class="tab-content hidden" id="behavior-tab">
        <div class="sensor-grid">
          <div class="sensor-chart">
            <h3>Accelerometer Data</h3>
            <div class="chart-container">
              <div id="accelerometer-chart"></div>
            </div>
          </div>
          <div class="sensor-chart">
            <h3>Gyroscope Data</h3>
            <div class="chart-container">
              <div id="gyroscope-chart"></div>
            </div>
          </div>
          <div class="current-behavior">
            <h3>Current Behavior</h3>
            <div class="behavior-indicator" id="behavior-status">
              Normal Riding
            </div>
          </div>
        </div>
      </div>

      <!-- OBD Info Tab -->
      <div class="tab-content hidden" id="obd-tab">
        <div class="obd-grid">
          <div class="obd-card" id="engine-metrics">
            <h3>Engine Metrics</h3>
            <div class="metric">
              <span>RPM</span>
              <span id="rpm-value">0</span>
            </div>
            <div class="metric">
              <span>Speed</span>
              <span id="speed-value">0 km/h</span>
            </div>
            <div class="metric">
              <span>Throttle</span>
              <span id="throttle-value">0%</span>
            </div>
          </div>
          <div class="obd-card" id="temperature-metrics">
            <h3>Temperature</h3>
            <div class="metric">
              <span>Coolant</span>
              <span id="coolant-temp">0°C</span>
            </div>
            <div class="metric">
              <span>Intake</span>
              <span id="intake-temp">0°C</span>
            </div>
          </div>
          <div class="obd-card" id="system-metrics">
            <h3>System Status</h3>
            <div class="metric">
              <span>Battery</span>
              <span id="battery-voltage">0V</span>
            </div>
            <div class="metric">
              <span>Engine Load</span>
              <span id="engine-load">0%</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Bottom Navigation -->
      <nav class="bottom-nav">
        <button class="nav-btn active" data-tab="dashboard">
          <span class="nav-icon">📊</span>
          <span>Dashboard</span>
        </button>
        <button class="nav-btn" data-tab="behavior">
          <span class="nav-icon">🎯</span>
          <span>Behavior</span>
        </button>
        <button class="nav-btn" data-tab="obd">
          <span class="nav-icon">🔧</span>
          <span>OBD Info</span>
        </button>
      </nav>
    </div>
    <script src="js/app.js"></script>
    <script src="js/charts.js"></script>
    <script src="js/websocket.js"></script>
  </body>
</html>
